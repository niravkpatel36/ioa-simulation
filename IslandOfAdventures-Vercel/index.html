<!doctype html><html><head><meta charset="utf-8"><title>Island of Adventures – Control</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8eef5;font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;padding:18px;max-width:1100px;margin:auto}
h1{font-size:20px;margin:0 0 14px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:99px;background:#121923;border:1px solid #24303f;font-weight:600}.chip.ok{border-color:#19d3b4}.chip.bad{border-color:#ff5a5f}
#state{font-size:22px;margin-left:auto}
#pv{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:2px solid #24303f;margin-bottom:14px}
#pv video,#pv canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#pv canvas{display:none;z-index:99999}
#err{display:none;background:#3a1216;border:1px solid #ff5a5f;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.b3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
button{font:inherit;color:#e8eef5;cursor:pointer;border-radius:14px;border:2px solid #24303f;background:#182231}
.big{height:130px;font-size:32px;font-weight:700}.big small{display:block;font-size:14px;font-weight:500;color:#7f90a3}
#bWAITING{border-color:#5aa2ff}#bROWING{border-color:#19d3b4}#bARRIVING{border-color:#ffc233}
.on#bWAITING{background:#5aa2ff;color:#04121f}.on#bROWING{background:#19d3b4;color:#03211c}.on#bARRIVING{background:#ffc233;color:#231a00}.on small{color:inherit!important}
button:disabled{opacity:.3;cursor:not-allowed}.row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}.sm{padding:14px 20px;font-weight:600}
.help{color:#7f90a3;margin-top:18px;font-size:14px}
</style></head><body>
<h1>Island of Adventures · Control</h1>
<div class="top"><div class="chip" id="cv">Loading videos…</div><div class="chip bad" id="ca">Audience screen not open</div><div class="chip" id="state">WAITING</div></div>
<div id="err"></div>
<div id="pv"></div>
<div class="b3"><button class="big" id="bWAITING">WAIT<small>boat is still</small></button><button class="big" id="bROWING">ROW<small>kids are rowing</small></button><button class="big" id="bARRIVING">ARRIVE<small>plays once</small></button></div>
<div class="row"><button class="sm" id="open">1 · Open audience screen</button><button class="sm" id="snd">Sound: ON</button><button class="sm" id="reset" style="border-color:#ff5a5f">Start over</button></div>
<div class="help">Drag the audience screen onto the LED, <b>click once on it</b> (fullscreen + sound), then use the big buttons. Keep both windows in the same browser and don't refresh during the show.</div>
<script src="engine.js"></script><script>
const $ = id => document.getElementById(id), ch = new BroadcastChannel('ioa'), eng = new Engine($('pv'), false);
let sound = true, lastBeat = 0, aud = null, win = null;
const push = () => ch.postMessage({ type: 'state', state: eng.state, sound });
function press(c) { eng.go(c); push(); render(); }
eng.onArrived = () => { push(); render(); };
$('bWAITING').onclick = () => press('WAITING'); $('bROWING').onclick = () => press('ROWING'); $('bARRIVING').onclick = () => press('ARRIVING');
$('reset').onclick = () => { if (confirm('Start over from the beginning?')) press('RESET'); };
$('snd').onclick = () => { sound = !sound; push(); render(); };
$('open').onclick = () => { if (win && !win.closed) return win.focus(); win = window.open('screen.html', 'ioa_screen', 'popup=yes,width=960,height=540,left=80,top=80'); };
ch.onmessage = e => { const m = e.data; if (m.type === 'hello') push(); else if (m.type === 'beat') { lastBeat = Date.now(); aud = m; } else if (m.type === 'bye') lastBeat = 0; };
function render() {
  const s = eng.state, locked = s === 'ARRIVING' || s === 'ARRIVED', conn = Date.now() - lastBeat < 3000;
  $('state').textContent = { WAITING: 'WAITING', ROWING: 'ROWING', ARRIVING: 'ARRIVING…', ARRIVED: 'ARRIVED 🎉' }[s];
  $('bWAITING').classList.toggle('on', s === 'WAITING'); $('bROWING').classList.toggle('on', s === 'ROWING'); $('bARRIVING').classList.toggle('on', locked);
  $('bWAITING').disabled = $('bROWING').disabled = locked; $('bARRIVING').disabled = locked;
  $('snd').textContent = 'Sound: ' + (sound ? 'ON' : 'OFF');
  $('cv').textContent = eng.errors.length ? 'Video problem' : eng.ready() ? 'Videos ready' : 'Loading videos…'; $('cv').className = 'chip ' + (eng.errors.length ? 'bad' : eng.ready() ? 'ok' : '');
  $('ca').textContent = conn ? (aud.fs ? 'Audience screen live (fullscreen)' + (aud.unlocked ? '' : ' – click it for sound') : 'Audience screen open – click it for fullscreen + sound') : 'Audience screen not open'; $('ca').className = 'chip ' + (conn ? 'ok' : 'bad');
  const er = [...eng.errors, ...(conn ? aud.errors : [])]; $('err').style.display = er.length ? 'block' : 'none'; $('err').textContent = er.join(' · ');
}
setInterval(render, 400); eng.load().then(render); render();
</script></body></html>
